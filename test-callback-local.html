<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local Callback</title>
</head>
<body>
    <h1>Test Local OAuth Callback</h1>
    <p>Testing callback URL: <a href="http://localhost:8080/auth/callback" target="_blank">http://localhost:8080/auth/callback</a></p>
    
    <script>
        // Test dengan parameter yang sama seperti production
        const testUrl = 'http://localhost:8080/auth/callback#access_token=test_token&expires_at=1758367575&expires_in=3600&provider_refresh_token=test_refresh&provider_token=test_provider&refresh_token=test_refresh&token_type=bearer';
        
        console.log('Test URL:', testUrl);
        
        function testCallback() {
            window.open(testUrl, '_blank');
        }
    </script>
    
    <button onclick="testCallback()">Test Callback URL</button>
    
    <div style="margin-top: 20px;">
        <h3>Expected Behavior:</h3>
        <ul>
            <li>URL should load without 404 error</li>
            <li>AuthCallback component should process the tokens</li>
            <li>Should redirect to dashboard or show success message</li>
        </ul>
    </div>
</body>
</html>
